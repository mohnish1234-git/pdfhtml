<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit HTML - Job ID: {{ job_id }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: #2c3e50;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: normal;
        }
        
        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .save-btn {
            padding: 8px 16px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .save-btn:hover {
            background: #219a52;
        }
        
        .save-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        
        .status {
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 4px;
            display: none;
        }
        
        .status.success {
            background: #2ecc71;
            color: white;
        }
        
        .status.error {
            background: #e74c3c;
            color: white;
        }
        
        .main-container {
            display: flex;
            width: 100%;
            height: 100vh;
            padding-top: 50px;
        }
        
        .editor-panel {
            width: 50%;
            height: calc(100vh - 50px);
            display: flex;
            flex-direction: column;
            border-right: 2px solid #34495e;
            background: white;
        }
        
        .editor-header {
            background: #34495e;
            color: white;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #2c3e50;
        }
        
        .editor-textarea {
            flex: 1;
            width: 100%;
            border: none;
            outline: none;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            padding: 15px;
            resize: none;
            line-height: 1.4;
            background: #fafafa;
            color: #333;
        }
        
        .editor-textarea:focus {
            background: white;
        }
        
        .preview-panel {
            width: 50%;
            height: calc(100vh - 50px);
            display: flex;
            flex-direction: column;
            background: white;
        }
        
        .preview-header {
            background: #34495e;
            color: white;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #2c3e50;
        }
        
        .preview-frame {
            flex: 1;
            width: 100%;
            border: none;
            background: white;
        }
        
        .resize-handle {
            width: 4px;
            background: #34495e;
            cursor: col-resize;
            position: relative;
        }
        
        .resize-handle:hover {
            background: #3498db;
        }
        
        .line-numbers {
            background: #ecf0f1;
            color: #7f8c8d;
            padding: 15px 10px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.4;
            text-align: right;
            border-right: 1px solid #bdc3c7;
            min-width: 50px;
            user-select: none;
        }
        
        .editor-with-lines {
            display: flex;
            flex: 1;
        }
        
        .shortcut-info {
            font-size: 12px;
            color: #95a5a6;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>HTML Editor - Job ID: {{ job_id }}</h1>
        <div class="header-controls">
            <div class="status" id="status"></div>
            <div class="shortcut-info">Ctrl+S to save</div>
            <button type="button" class="save-btn" id="saveBtn" onclick="saveChanges()">Save Changes</button>
        </div>
    </div>

    <div class="main-container">
        <div class="editor-panel" id="editorPanel">
            <div class="editor-header">
                HTML Source Code
                <span style="float: right; font-weight: normal; font-size: 12px;">
                    Lines: <span id="lineCount">1</span>
                </span>
            </div>
            <div class="editor-with-lines">
                <div class="line-numbers" id="lineNumbers">1</div>
                <form method="POST" id="editorForm">
                    <textarea 
                        class="editor-textarea" 
                        id="editor" 
                        name="edited_html" 
                        oninput="updatePreview()" 
                        onscroll="syncScroll()"
                        spellcheck="false"
                        autocomplete="off"
                    >{{ html_content|safe }}</textarea>
                </form>
            </div>
        </div>

        <div class="resize-handle" id="resizeHandle"></div>

        <div class="preview-panel" id="previewPanel">
            <div class="preview-header">
                Live Preview
                <span style="float: right; font-weight: normal; font-size: 12px;">
                    Auto-refresh enabled
                </span>
            </div>
            <iframe class="preview-frame" id="preview"></iframe>
        </div>
    </div>

    <script>
        let isResizing = false;
        let hasUnsavedChanges = false;
        let lastSavedContent = document.getElementById('editor').value;

        // Update preview function
        function updatePreview() {
            const code = document.getElementById("editor").value;
            const previewFrame = document.getElementById("preview");
            
            // Check for unsaved changes
            hasUnsavedChanges = (code !== lastSavedContent);
            updateSaveButton();
            updateLineNumbers();
            
            try {
                previewFrame.srcdoc = code;
            } catch (error) {
                console.warn('Preview update failed:', error);
            }
        }

        // Update line numbers
        function updateLineNumbers() {
            const editor = document.getElementById('editor');
            const lineNumbers = document.getElementById('lineNumbers');
            const lineCount = document.getElementById('lineCount');
            
            const lines = editor.value.split('\n').length;
            lineCount.textContent = lines;
            
            let numbersHtml = '';
            for (let i = 1; i <= lines; i++) {
                numbersHtml += i + '\n';
            }
            lineNumbers.textContent = numbersHtml;
        }

        // Sync scroll between editor and line numbers
        function syncScroll() {
            const editor = document.getElementById('editor');
            const lineNumbers = document.getElementById('lineNumbers');
            lineNumbers.scrollTop = editor.scrollTop;
        }

        // Update save button state
        function updateSaveButton() {
            const saveBtn = document.getElementById('saveBtn');
            const status = document.getElementById('status');
            
            if (hasUnsavedChanges) {
                saveBtn.textContent = 'Save Changes *';
                saveBtn.style.background = '#e67e22';
            } else {
                saveBtn.textContent = 'Save Changes';
                saveBtn.style.background = '#27ae60';
            }
        }

        // Save changes function
        async function saveChanges() {
            const saveBtn = document.getElementById('saveBtn');
            const status = document.getElementById('status');
            const form = document.getElementById('editorForm');
            
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
            status.style.display = 'inline-block';
            status.className = 'status';
            status.textContent = 'Saving...';

            try {
                const formData = new FormData(form);
                const response = await fetch(window.location.href, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                if (response.ok) {
                    // Try to parse as JSON first, fallback to text
                    let result;
                    const contentType = response.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        result = await response.json();
                        status.className = 'status success';
                        status.textContent = result.message || 'Saved successfully!';
                    } else {
                        result = await response.text();
                        status.className = 'status success';
                        status.textContent = 'Saved successfully!';
                    }
                    
                    lastSavedContent = document.getElementById('editor').value;
                    hasUnsavedChanges = false;
                    updateSaveButton();
                    
                    setTimeout(() => {
                        status.style.display = 'none';
                    }, 3000);
                } else {
                    // Try to get error message from response
                    let errorMessage = 'Save failed!';
                    try {
                        const errorData = await response.json();
                        errorMessage = errorData.message || errorMessage;
                    } catch (e) {
                        // If not JSON, just use default message
                    }
                    
                    status.className = 'status error';
                    status.textContent = errorMessage;
                }
            } catch (error) {
                status.className = 'status error';
                status.textContent = 'Network error: ' + error.message;
                console.error('Save error:', error);
            } finally {
                saveBtn.disabled = false;
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveChanges();
            }
            
            if (e.key === 'Tab' && e.target.id === 'editor') {
                e.preventDefault();
                const textarea = e.target;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                
                textarea.value = textarea.value.substring(0, start) + 
                               '\t' + 
                               textarea.value.substring(end);
                textarea.selectionStart = textarea.selectionEnd = start + 1;
                updatePreview();
            }
        });

        // Panel resizing functionality
        const resizeHandle = document.getElementById('resizeHandle');
        const editorPanel = document.getElementById('editorPanel');
        const previewPanel = document.getElementById('previewPanel');

        resizeHandle.addEventListener('mousedown', function(e) {
            isResizing = true;
            document.addEventListener('mousemove', handleResize);
            document.addEventListener('mouseup', stopResize);
            document.body.style.cursor = 'col-resize';
            e.preventDefault();
        });

        function handleResize(e) {
            if (!isResizing) return;
            
            const containerWidth = document.querySelector('.main-container').clientWidth;
            const leftWidth = (e.clientX / containerWidth) * 100;
            
            if (leftWidth > 20 && leftWidth < 80) {
                editorPanel.style.width = leftWidth + '%';
                previewPanel.style.width = (100 - leftWidth) + '%';
            }
        }

        function stopResize() {
            isResizing = false;
            document.removeEventListener('mousemove', handleResize);
            document.removeEventListener('mouseup', stopResize);
            document.body.style.cursor = 'default';
        }

        // Warn about unsaved changes
        window.addEventListener('beforeunload', function(e) {
            if (hasUnsavedChanges) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        // Initialize
        window.addEventListener('load', function() {
            updatePreview();
            updateLineNumbers();
            
            // Focus on editor
            document.getElementById('editor').focus();
        });
    </script>
</body>
</html>
